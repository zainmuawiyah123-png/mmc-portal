services:
  - type: web
    name: mmc-portal
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: OPPORTUNITY_SYNC_ENABLED
        value: "true"
      - key: PAYMENT_BANK_NAME
        sync: false
      - key: PAYMENT_ACCOUNT_HOLDER
        sync: false
      - key: PAYMENT_IBAN
        sync: false
      - key: PAYMENT_SWIFT
        sync: false
      - key: PAYMENT_CLIQ_ALIAS
        sync: false
    disk:
      name: mmc-data
      mountPath: /data
      sizeGB: 2
