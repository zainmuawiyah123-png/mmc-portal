services:
  - type: web
    name: mmc-portal
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: OPPORTUNITY_SYNC_ENABLED
        value: "true"
      - key: PAYMENT_BANK_NAME
        sync: false
      - key: PAYMENT_ACCOUNT_HOLDER
        sync: false
      - key: PAYMENT_IBAN
        sync: false
      - key: PAYMENT_SWIFT
        sync: false
      - key: PAYMENT_CLIQ_ALIAS
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: JOFOTARA_ENABLED
        sync: false
      - key: JOFOTARA_URL
        sync: false
      - key: JOFOTARA_CLIENT_ID
        sync: false
      - key: JOFOTARA_SECRET_KEY
        sync: false
      - key: JOFOTARA_INCOME_SOURCE
        sync: false
      - key: EINVOICE_SELLER_TIN
        sync: false
      - key: EINVOICE_SELLER_NAME
        sync: false
    disk:
      name: mmc-data
      mountPath: /data
      sizeGB: 2
