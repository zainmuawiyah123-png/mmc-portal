<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مساحة المقيّم / Evaluator workspace · MMC</title><link rel="stylesheet" href="../portal/pt-9f3c7a1e5b2d/assets/portal.css"><style>.rq{border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0}.rq textarea{width:100%;min-height:56px}.sc{width:90px}table.m{width:100%;border-collapse:collapse}table.m td,table.m th{border:1px solid var(--line);padding:6px 8px;text-align:center}.flag{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:6px 10px;border-radius:6px;margin:4px 0;font-size:13px}</style></head>
<body><div class="p-top"><div class="brand"><span class="mark">M</span><span><span>مساحة المقيّم</span><small>MMC Tender Evaluation</small></span></div><div class="spacer"></div><span data-user-name></span><button class="btn ghost" id="logout">خروج / Log out</button></div>
<main class="p-wrap"><div class="p-head"><div class="eyebrow">تقييم فني مستقل</div><h1>العطاءات المكلَّف بتقييمها</h1><p>ترى العروض بأسماء مجهولة (عارض A, B…) ودون أي أسعار. درجاتك لا يراها زملاؤك قبل الاعتماد.</p></div><div id="msg"></div><div id="list"></div><div id="work"></div></main>
<script>(function(){
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function note(t,k){$('#msg').innerHTML='<div class="note '+(k||'')+'">'+esc(t)+'</div>'}
var cur=null;
API.me().then(function(d){if(!['consultant','buyer','admin'].includes(d.user.role)){note('هذا المسار مخصص للمقيّمين (مكتب استشاري أو جهة مشترية).','warn');return}load()}).catch(function(){location.href='../portal/pt-9f3c7a1e5b2d/login.html?next=../../consultant/index.html'});
$('#logout').onclick=function(){API.logout().then(function(){location.href='../portal/pt-9f3c7a1e5b2d/login.html'})};
function load(){API.request('GET','/committee/my-assignments').then(function(d){$('#list').innerHTML=d.assignments.map(function(a){return '<div class="p-card tight"><h3>'+esc(a.reference||'')+' · '+esc(a.name)+'</h3><p>'+esc(a.authority||'')+' · '+esc(a.memberRole)+(a.finalized?' · <span class="badge ready">اعتُمدت النتيجة</span>':'')+'</p><p class="mini">تقدمك: '+a.progress.done+' / '+a.progress.total+'</p><button class="btn sm amber" data-id="'+esc(a.tenderId)+'">'+(a.finalized?'عرض':'فتح التقييم')+'</button></div>'}).join('')||'<div class="empty">لا توجد تكليفات حالياً. يضيفك صاحب العطاء إلى لجنة التقييم بالبريد المسجَّل لديك.</div>';document.querySelectorAll('#list button').forEach(function(b){b.onclick=function(){open(b.dataset.id)}})}).catch(function(e){note(e.message,'warn')})}
function open(id){API.request('GET','/committee/tenders/'+id+'/work').then(function(w){cur=w;draw()}).catch(function(e){note(e.message,'warn')})}
function draw(){var w=cur,lock=w.tender.finalized;$('#work').innerHTML='<div class="p-card"><h2>'+esc(w.tender.name)+'</h2><p class="mini">الحد الأدنى للنجاح الفني: '+esc(w.tender.technicalThreshold)+'</p>'+w.bidders.map(function(b,bi){return '<h3>عارض '+esc(b.label)+'</h3>'+(b.documents.length?'<p class="mini">الملفات الفنية: '+b.documents.map(function(d){return '<a href="/api/procurement/submissions/'+esc(b.submissionId)+'/documents/'+esc(d.id)+'" target="_blank" rel="noopener">'+esc(d.name)+'</a>'}).join(' · ')+'</p>':'')+b.responses.map(function(r,ri){var q=w.requirements[ri];return '<div class="rq"><strong>'+esc(q.title)+'</strong> <span class="mini">(الوزن '+esc(q.weight)+(q.mandatory?' · إلزامي':'')+')</span>'+(q.description?'<p class="mini">'+esc(q.description)+'</p>':'')+'<p style="white-space:pre-wrap">'+esc(r.answer||'— لا توجد إجابة —')+'</p><label>درجتك (0–100) <input class="sc" type="number" min="0" max="100" step="1" data-s="'+esc(b.submissionId)+'" data-r="'+esc(r.requirementId)+'" value="'+(r.myScore==null?'':esc(r.myScore))+'"'+(lock?' disabled':'')+'></label> <input class="nt" placeholder="ملاحظة (اختياري)" style="width:60%" data-s="'+esc(b.submissionId)+'" data-r="'+esc(r.requirementId)+'" value="'+esc(r.myNote||'')+'"'+(lock?' disabled':'')+'></div>'}).join('')}).join('')+(lock?'':'<button class="btn amber" id="save">حفظ درجاتي</button>')+'</div>';var s=$('#save');if(s)s.onclick=save;window.scrollTo(0,document.body.scrollHeight>0?$('#work').offsetTop:0)}
function save(){var notes={};document.querySelectorAll('.nt').forEach(function(n){notes[n.dataset.s+'|'+n.dataset.r]=n.value});var arr=[];document.querySelectorAll('.sc').forEach(function(i){if(i.value!=='')arr.push({submissionId:i.dataset.s,requirementId:i.dataset.r,score:Number(i.value),note:notes[i.dataset.s+'|'+i.dataset.r]||''})});if(!arr.length){note('أدخل درجة واحدة على الأقل.','warn');return}API.request('POST','/committee/tenders/'+cur.tender.id+'/scores',{scores:arr}).then(function(){note('حُفظت درجاتك ('+arr.length+').','ok');load()}).catch(function(e){note(e.message,'warn')})}
})();</script><script src="../portal/pt-9f3c7a1e5b2d/assets/api.js"></script><script src="../portal/pt-9f3c7a1e5b2d/assets/i18n.js"></script></body></html>
