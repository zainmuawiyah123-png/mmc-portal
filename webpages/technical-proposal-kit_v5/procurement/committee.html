<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لجنة التقييم / Evaluation committee · MMC</title><link rel="stylesheet" href="../portal/pt-9f3c7a1e5b2d/assets/portal.css"><style>.rq{border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0}.rq textarea{width:100%;min-height:56px}.sc{width:90px}table.m{width:100%;border-collapse:collapse}table.m td,table.m th{border:1px solid var(--line);padding:6px 8px;text-align:center}.flag{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:6px 10px;border-radius:6px;margin:4px 0;font-size:13px}</style></head>
<body><div class="p-top"><div class="brand"><span class="mark">M</span><span><span>لجنة تقييم العروض</span><small>MMC Tender Evaluation</small></span></div><div class="spacer"></div><span data-user-name></span><button class="btn ghost" id="logout">خروج / Log out</button></div>
<div class="p-nav"><a href="index.html">← لوحة المشتريات</a></div><main class="p-wrap"><div class="p-head"><div class="eyebrow">تقييم فني جماعي</div><h1 id="title">لجنة التقييم</h1><p>أضف الاستشاريين أو أعضاء الجهة بالبريد المسجَّل، ثم اعتمد المتوسط بعد اكتمال تقييم الجميع. فتح العرض المالي يبقى خطوة منفصلة.</p></div><div id="msg"></div><div class="p-card"><h2>أعضاء اللجنة</h2><div id="members"></div><div id="add" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><input id="email" type="email" placeholder="بريد المقيّم المسجَّل" style="flex:1;min-width:200px"><select id="mrole"><option value="consultant">استشاري</option><option value="member">عضو</option><option value="chair">رئيس اللجنة</option></select><button class="btn amber" id="addbtn">إضافة</button></div></div><div class="p-card"><h2>مصفوفة الدرجات</h2><div id="matrix"></div><button class="btn amber" id="fin" style="margin-top:12px">اعتماد نتيجة اللجنة</button></div></main>
<script>(function(){
var $=function(s){return document.querySelector(s)},id=new URLSearchParams(location.search).get('tender');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function note(t,k){$('#msg').innerHTML='<div class="note '+(k||'')+'">'+esc(t)+'</div>'}
if(!id){note('افتح هذه الصفحة بالرابط committee.html?tender=رقم_العطاء','warn')}
API.me().then(function(){if(id)load()}).catch(function(){location.href='../portal/pt-9f3c7a1e5b2d/login.html?next=../../procurement/committee.html?tender='+encodeURIComponent(id||'')});
$('#logout').onclick=function(){API.logout().then(function(){location.href='../portal/pt-9f3c7a1e5b2d/login.html'})};
function load(){API.request('GET','/committee/tenders/'+encodeURIComponent(id)).then(draw).catch(function(e){note(e.message,'warn')})}
function draw(d){$('#title').textContent=d.tender.name;$('#members').innerHTML=d.members.map(function(m){return '<div class="rq">'+esc(m.name)+' <span class="mini">'+esc(m.email)+' · '+esc(m.memberRole)+' · التقدم '+m.scored+'/'+m.total+'</span>'+(d.finalized?'':' <button class="btn sm ghost" data-rm="'+esc(m.userId)+'">إزالة</button>')+'</div>'}).join('')||'<div class="empty">لا يوجد أعضاء بعد.</div>';document.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){API.request('DELETE','/committee/tenders/'+encodeURIComponent(id)+'/members/'+encodeURIComponent(b.dataset.rm)).then(load).catch(function(e){note(e.message,'warn')})}});
var head='<tr><th>العارض</th>'+d.members.map(function(m){return '<th>'+esc(m.name)+'</th>'}).join('')+'<th>متوسط اللجنة</th></tr>';
$('#matrix').innerHTML='<div style="overflow-x:auto"><table class="m">'+head+d.bidders.map(function(b){return '<tr><td>'+esc(b.label)+' · '+esc(b.company||b.contractorName)+'</td>'+b.perEvaluator.map(function(x){return '<td>'+x.normalized.toFixed(1)+'</td>'}).join('')+'<td><strong>'+(b.committeeAverage==null?'—':b.committeeAverage.toFixed(1))+'</strong></td></tr>'}).join('')+'</table></div>'+d.bidders.map(function(b){return b.divergentRequirements.map(function(r){return '<div class="flag">فرق كبير (≥ '+d.spreadFlag+') بين المقيّمين — عارض '+esc(b.label)+' · '+esc(r.title)+'</div>'}).join('')}).join('');
$('#fin').disabled=d.finalized;$('#fin').textContent=d.finalized?'اعتُمدت النتيجة':'اعتماد نتيجة اللجنة'}
$('#addbtn').onclick=function(){API.request('POST','/committee/tenders/'+encodeURIComponent(id)+'/members',{email:$('#email').value,memberRole:$('#mrole').value}).then(function(){$('#email').value='';note('أُضيف العضو وأُرسل له إشعار بالبريد (إن كان البريد مفعّلاً).','ok');load()}).catch(function(e){note(e.message,'warn')})};
$('#fin').onclick=function(){if(!confirm('اعتماد متوسط درجات اللجنة وكتابة النتيجة الفنية؟ لا يمكن التراجع.'))return;API.request('POST','/committee/tenders/'+encodeURIComponent(id)+'/finalize').then(function(r){note(r.message,'ok');load()}).catch(function(e){note(e.message,'warn')})};
})();</script><script src="../portal/pt-9f3c7a1e5b2d/assets/api.js"></script><script src="../portal/pt-9f3c7a1e5b2d/assets/i18n.js"></script></body></html>
