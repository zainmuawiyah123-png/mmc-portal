<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-ar="مساحة الجهة · MMC" data-en="Organization workspace · MMC">مساحة الجهة · MMC</title><link rel="stylesheet" href="../portal/pt-9f3c7a1e5b2d/assets/portal.css"><style>
.split{display:grid;grid-template-columns:1fr 1.6fr;gap:18px;align-items:start}.mini{font-size:11.5px;color:var(--mut)}
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font-weight:800;cursor:pointer;font-family:inherit}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{display:block;width:100%;text-align:start;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;margin:0 0 8px;cursor:pointer;font-family:inherit}.item.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-l)}
.item b{display:block;margin-bottom:3px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.timeline{list-style:none;margin:8px 0 0;padding:0}.timeline li{border-inline-start:3px solid var(--line);padding:2px 10px;margin:0 0 8px;font-size:12.5px}.timeline .when{color:var(--mut);font-size:11px}
.codebox{font-family:monospace;font-size:22px;font-weight:900;letter-spacing:2px;background:#fff7ed;border:2px dashed var(--accent);border-radius:10px;padding:12px;text-align:center;direction:ltr;margin:8px 0}
.req{display:grid;grid-template-columns:2fr 1fr 70px;gap:7px;margin:7px 0}.req input{min-width:0}
.fidic{background:#f3f7fb;border:1px solid #cddbea;border-radius:10px;padding:12px;margin:10px 0}
@media(max-width:850px){.split,.grid2{grid-template-columns:1fr}}
</style></head>
<body data-page="org"><div class="p-top"><div class="brand"><span class="mark">M</span><span><span data-ar="مساحة الجهة" data-en="Organization workspace">مساحة الجهة</span><small>Requests · Projects · Procurement</small></span></div><div class="spacer"></div><span data-user-name></span><button class="btn ghost" id="logout"><span data-ar="خروج" data-en="Log out">خروج</span></button></div>
<div class="p-nav"><a class="on" href="index.html"><span data-ar="الطلبات والفريق" data-en="Requests & team">الطلبات والفريق</span></a><a href="../procurement/index.html"><span data-ar="لوحة المشتريات" data-en="Procurement desk">لوحة المشتريات</span></a><a href="../portal/pt-9f3c7a1e5b2d/billing.html"><span data-ar="الاشتراك والفواتير" data-en="Billing">الاشتراك والفواتير</span></a><a href="../portal/pt-9f3c7a1e5b2d/index.html"><span data-ar="البوابة العامة" data-en="Main portal">البوابة العامة</span></a></div>
<main class="p-wrap">
<div class="p-head"><div class="eyebrow"><span data-ar="من الطلب إلى العطاء" data-en="From request to tender">من الطلب إلى العطاء</span></div><h1 id="orgTitle">…</h1><p id="orgSub" class="small"></p></div>
<div id="msg"></div>
<div class="tabs" id="tabs"></div>

</main>
<script src="../portal/pt-9f3c7a1e5b2d/assets/api.js"></script>
<script src="../portal/pt-9f3c7a1e5b2d/assets/i18n.js"></script>
<script>
(function(){
function T(a,e){return window.MMC_I18N?MMC_I18N.T(a,e):a}function EN(){return T('ar','en')==='en'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function P(o,k){return EN()?o[k+'En']||o[k+'Ar']||'':o[k+'Ar']||''}
function pair(m,k){return m&&m[k]?T(m[k][0],m[k][1]):k}
function fmt(t){return t?new Date(t*1000).toLocaleDateString(EN()?'en-GB':'ar-JO'):''}
function say(t,kind){document.getElementById('msg').innerHTML=t?'<div class="note '+(kind||'')+'">'+esc(t)+'</div>':'';if(t)window.scrollTo({top:0,behavior:'smooth'})}
var STATUS={draft:['مسودة','Draft'],submitted:['مُقدَّم','Submitted'],in_study:['قيد الدراسة','In study'],returned:['معاد للتعديل','Returned'],awaiting_approval:['بانتظار الاعتماد','Awaiting approval'],ready:['جاهز للمشتريات','Ready for procurement'],published:['منشور','Published'],cancelled:['ملغى','Cancelled']};
var BADGE={draft:'arch',submitted:'new',in_study:'proc',returned:'warn',awaiting_approval:'proc',ready:'ready',published:'ready',cancelled:'arch'};
var ACTION={submit:['تقديم الطلب','Submit request'],take:['استلام للدراسة','Take for study'],return:['إعادة للطالب','Return to requester'],ready:['تجهيز الحزمة','Mark package ready'],approve:['اعتماد الحزمة','Approve package'],reject:['رفض وإعادة للمشاريع','Reject & return to projects'],send_back:['إعادة لدائرة المشاريع','Send back to projects'],cancel:['إلغاء الطلب','Cancel request'],publish:['إنشاء ونشر العطاء','Create & publish tender']};
var NOTE_ASK={return:['سبب الإعادة (يظهر للطالب):','Reason for returning (shown to the requester):'],reject:['سبب الرفض:','Reason for rejection:'],send_back:['ما المطلوب من دائرة المشاريع؟','What do you need from the projects department?']};
var KIND={brief:['مرفق من الطالب','Requester attachment'],drawings:['مخططات','Drawings'],specifications:['مواصفات','Specifications'],boq:['جدول كميات','Bill of quantities'],conditions:['شروط العطاء','Tender conditions'],particular_conditions:['الشروط الخاصة (FIDIC)','Particular conditions (FIDIC)'],internal:['داخلي — لا يظهر للمقاول','Internal — hidden from bidders']};
var SERVICE={works:['أعمال إنشائية','Works'],consultancy:['استشارات','Consultancy'],supply:['توريد','Supply'],other:['أخرى','Other']};
var EVENT={create:['أُنشئ الطلب','Request created'],submit:['قُدِّم','Submitted'],take:['استُلم للدراسة','Taken for study'],return:['أُعيد للطالب','Returned to requester'],ready:['جُهّزت الحزمة','Package marked ready'],approve:['اعتُمدت الحزمة','Package approved'],reject:['رُفضت الحزمة','Package rejected'],send_back:['أُعيد للمشاريع','Sent back to projects'],cancel:['أُلغي','Cancelled'],publish:['نُشر العطاء','Tender published'],edit:['تعديل','Edited'],docs:['رفع وثائق','Documents uploaded'],doc_delete:['حذف وثيقة','Document removed']};
var S={tab:'requests',org:null,meta:null,list:[],sel:null,detail:null,form:null,publish:false,invite:null,filter:''};

function load(){return Promise.all([API.me(),API.request('GET','/org'),API.request('GET','/requests/meta'),API.request('GET','/requests')]).then(function(r){
  document.querySelector('[data-user-name]').textContent=r[0].user.name;S.org=r[1];S.meta=r[2];S.list=r[3].requests;S.counts=r[3].counts;
  if(S.sel){return API.request('GET','/requests/'+S.sel).then(function(d){S.detail=d.request}).catch(function(){S.sel=null;S.detail=null})}
}).then(render).catch(function(e){if(e.status===401)location.href='../portal/pt-9f3c7a1e5b2d/login.html';else if(e.status===403)document.getElementById('view').innerHTML='<div class="note warn">'+T('هذه الصفحة لحسابات الجهات (المشتريات). سجّل بحساب جهة.','This page is for organization accounts. Sign in with an organization account.')+'</div>';else say(e.message,'warn')})}

function roleName(k){var r=(S.org.roles||[]).filter(function(x){return x.key===k})[0];return r?(EN()?r.en:r.ar):k}
function head(){var o=S.org.org,s=S.org.seats;document.getElementById('orgTitle').textContent=o.name;
  document.getElementById('orgSub').innerHTML=esc(T('دورك: ','Your role: '))+'<b>'+esc(roleName(S.org.myRole))+'</b> · '+(o.verified?'<span class="badge ready">✓ '+esc(T('جهة موثّقة','Verified organization'))+'</span>':'<span class="badge new">'+esc(T('غير موثّقة بعد — النشر يتطلب التوثيق','Not verified yet — publishing requires verification'))+'</span>')+' · '+esc(T('الأعضاء: ','Members: '))+s.members+' / '+(s.max==null?T('غير محدود','unlimited'):s.max)+(o.requireApproval?' · '+esc(T('اعتماد الحزمة مفعّل','Package approval on')):'')
  var tabs=[['requests',T('الطلبات','Requests')]];if(S.org.myRole==='manager')tabs.push(['team',T('الفريق والإعدادات','Team & settings')]);
  document.getElementById('tabs').innerHTML=tabs.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+esc(t[1])+'</button>'}).join('')}
function render(){head();document.getElementById('view').innerHTML=S.tab==='team'?teamHtml():requestsHtml()}

/* ---------------- الطلبات ---------------- */
function canCreate(){return ['requester','manager'].indexOf(S.org.myRole)>-1}
function requestsHtml(){
  var counts=S.counts||{};var chips='<button class="btn sm '+(S.filter===''?'amber':'light')+'" data-filter="">'+esc(T('الكل','All'))+' ('+S.list.length+')</button> '+Object.keys(STATUS).filter(function(k){return counts[k]}).map(function(k){return '<button class="btn sm '+(S.filter===k?'amber':'light')+'" data-filter="'+k+'">'+esc(pair(STATUS,k))+' ('+counts[k]+')</button>'}).join(' ');
  var items=S.list.filter(function(r){return !S.filter||r.status===S.filter}).map(function(r){return '<button class="item'+(S.sel===r.id?' on':'')+'" data-open="'+esc(r.id)+'"><b>'+esc(EN()&&r.titleEn?r.titleEn:r.title)+'</b><span class="badge '+BADGE[r.status]+'">'+esc(pair(STATUS,r.status))+'</span> <span class="mini">'+esc(r.requester)+' · '+fmt(r.updatedAt)+'</span></button>'}).join('')||'<div class="note">'+esc(T('لا توجد طلبات.','No requests.'))+'</div>';
  return '<div class="split"><section class="p-card"><h2><span class="n">01</span> '+esc(T('الطلبات','Requests'))+'</h2><div class="row" style="margin-bottom:10px">'+chips+'</div>'+(canCreate()?'<button class="btn amber" data-new="1" style="margin-bottom:10px">+ '+esc(T('طلب جديد','New request'))+'</button>':'')+items+'</section><section class="p-card" id="detailCard">'+(S.form?formHtml():S.detail?detailHtml():'<p class="mini">'+esc(T('اختر طلباً من القائمة أو أنشئ طلباً جديداً.','Select a request or create a new one.'))+'</p>')+'</section></div>'}

function opt(list,val,key,lab){return list.map(function(o){return '<option value="'+esc(o[key])+'"'+(o[key]===val?' selected':'')+'>'+esc(typeof lab==='function'?lab(o):o[lab])+'</option>'}).join('')}
function formHtml(){var r=S.form,m=S.meta;return '<h2>'+esc(r.id?T('تعديل الطلب','Edit request'):T('طلب جديد','New request'))+'</h2><p class="mini">'+esc(T('صِف الخدمة أو المشروع المطلوب. تتولى دائرة المشاريع تجهيز المخططات والمواصفات وشروط العطاء.','Describe the service or project. The projects department prepares drawings, specifications and tender conditions.'))+'</p><div class="grid2"><div class="fld"><label>'+esc(T('عنوان الطلب','Request title'))+'</label><input id="f_title" value="'+esc(r.title)+'"></div><div class="fld"><label>'+esc(T('العنوان بالإنجليزية (اختياري)','Title in English (optional)'))+'</label><input id="f_titleEn" dir="ltr" value="'+esc(r.titleEn)+'"></div><div class="fld"><label>'+esc(T('نوع الخدمة','Service type'))+'</label><select id="f_service"><option value="">—</option>'+m.serviceTypes.map(function(k){return '<option value="'+k+'"'+(r.serviceType===k?' selected':'')+'>'+esc(pair(SERVICE,k))+'</option>'}).join('')+'</select></div><div class="fld"><label>'+esc(T('الدولة','Country'))+'</label><select id="f_country"><option value="">—</option>'+opt(m.countries,r.country,'code',function(c){return EN()?c.en:c.ar})+'</select></div><div class="fld"><label>'+esc(T('الموقع','Location'))+'</label><input id="f_location" value="'+esc(r.location)+'"></div><div class="fld"><label>'+esc(T('المطلوب بحلول','Needed by'))+'</label><input id="f_needed" type="date" value="'+esc(r.neededBy)+'"></div><div class="fld"><label>'+esc(T('الميزانية التقديرية','Estimated budget'))+'</label><input id="f_budget" type="number" min="0" step="any" value="'+esc(r.budget)+'"></div><div class="fld"><label>'+esc(T('العملة','Currency'))+'</label><select id="f_currency"><option value="">—</option>'+m.currencies.map(function(c){return '<option'+(r.currency===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select></div></div><div class="fld"><label>'+esc(T('وصف الطلب والمتطلبات الأولية','Description and initial requirements'))+'</label><textarea id="f_desc" rows="5">'+esc(r.description)+'</textarea></div><div class="row"><button class="btn amber" data-save="1">'+esc(T('حفظ','Save'))+'</button><button class="btn light" data-cancelform="1">'+esc(T('إلغاء','Cancel'))+'</button></div>'}

function detailHtml(){var r=S.detail,m=S.meta;
  var kv=function(l,v){return v?'<div><span class="mini">'+esc(l)+'</span><br><b>'+esc(v)+'</b></div>':''};
  var country=(m.countries.filter(function(c){return c.code===r.country})[0]||{});
  var info='<div class="grid2">'+kv(T('الطالب','Requester'),r.requester)+kv(T('المسؤول في المشاريع','Projects lead'),r.assignee)+kv(T('نوع الخدمة','Service'),r.serviceType?pair(SERVICE,r.serviceType):'')+kv(T('الدولة','Country'),EN()?country.en:country.ar)+kv(T('الموقع','Location'),r.location)+kv(T('المطلوب بحلول','Needed by'),r.neededBy)+kv(T('الميزانية','Budget'),r.budget!=null?(Number(r.budget).toLocaleString()+' '+(r.currency||'')):'')+'</div>';
  var acts=r.actions.map(function(a){return '<button class="btn sm '+(a==='publish'||a==='ready'||a==='submit'||a==='approve'||a==='take'?'amber':'light')+'" data-act="'+a+'">'+esc(pair(ACTION,a))+'</button>'}).join(' ');
  var fid='<div class="fidic"><b>'+esc(T('عقد FIDIC','FIDIC contract'))+'</b>';
  if(r.canEditTech){fid+='<div class="grid2" style="margin-top:8px"><div class="fld"><label>'+esc(T('نوع العقد','Contract type'))+'</label><select id="t_book"><option value="">—</option>'+m.fidicBooks.map(function(b){return '<option value="'+b.key+'"'+(r.fidicBook===b.key?' selected':'')+'>'+esc(EN()?b.en:b.ar)+'</option>'}).join('')+'</select></div><div class="fld"><label>'+esc(T('الإصدار','Edition'))+'</label><select id="t_ed"><option value="">—</option>'+m.fidicEditions.map(function(e){return '<option value="'+e+'"'+(r.fidicEdition===e?' selected':'')+'>'+(e==='other'?esc(T('آخر','Other')):e)+'</option>'}).join('')+'</select></div></div><div class="fld"><label>'+esc(T('ملاحظات الشروط الخاصة وملحق بيانات العقد','Particular conditions / contract data notes'))+'</label><textarea id="t_notes" rows="3">'+esc(r.particularNotes)+'</textarea></div><button class="btn sm amber" data-savetech="1">'+esc(T('حفظ بيانات العقد','Save contract data'))+'</button>'}
  else{fid+='<p style="margin:6px 0">'+(r.fidicBook?esc(EN()?r.fidicBookEn:r.fidicBookAr)+' · '+esc(r.fidicEdition==='other'?T('إصدار آخر','other edition'):(r.fidicEdition||'')):'<span class="mini">'+esc(T('لم يُحدَّد بعد.','Not set yet.'))+'</span>')+'</p>'+(r.particularNotes?'<p class="mini">'+esc(r.particularNotes)+'</p>':'')}
  fid+='<p class="mini" style="margin:8px 0 0">'+esc(T('المنصة لا تنشر نص شروط FIDIC العامة (محمية بحقوق النشر). اختر نوع العقد وإصداره وارفع الشروط الخاصة وملحق بيانات العقد. المرجع الرسمي: ','The platform does not publish FIDIC General Conditions (copyrighted). Choose the contract type and edition and upload the Particular Conditions and contract data. Official reference: '))+'<a href="'+esc(m.fidicUrl)+'" target="_blank" rel="noopener">fidic.org</a></p></div>';
  var docs=r.docs.map(function(d){return '<tr><td>'+esc(pair(KIND,d.kind))+'</td><td><a href="/api/requests/'+esc(r.id)+'/docs/'+esc(d.id)+'">'+esc(d.name)+'</a></td><td class="mini">'+Math.round(d.size/1024)+' KB</td><td class="mini">'+(d.public?esc(T('يراه المقاول','Visible to bidders')):esc(T('داخلي','Internal')))+'</td><td>'+(r.uploadKinds.indexOf(d.kind)>-1?'<button class="btn sm light" data-deldoc="'+esc(d.id)+'">'+esc(T('حذف','Delete'))+'</button>':'')+'</td></tr>'}).join('')||'<tr><td colspan="5" class="mini">'+esc(T('لا وثائق بعد.','No documents yet.'))+'</td></tr>';
  var up=r.uploadKinds.length?'<div class="row" style="margin-top:8px"><select id="u_kind">'+r.uploadKinds.map(function(k){return '<option value="'+k+'">'+esc(pair(KIND,k))+'</option>'}).join('')+'</select><input id="u_files" type="file" multiple><button class="btn sm amber" data-upload="1">'+esc(T('رفع','Upload'))+'</button></div>':'';
  var ev=r.events.map(function(e){return '<li><b>'+esc(pair(EVENT,e.action))+'</b> — '+esc(e.who||'')+' <span class="when">'+fmt(e.at)+'</span>'+(e.note?'<br><span class="mini">'+esc(e.note)+'</span>':'')+'</li>'}).join('');
  var pub=S.publish?publishHtml(r):'';
  return '<div class="row" style="justify-content:space-between"><h2 style="margin:0">'+esc(EN()&&r.titleEn?r.titleEn:r.title)+'</h2><span class="badge '+BADGE[r.status]+'">'+esc(pair(STATUS,r.status))+'</span></div>'+(r.reviewNote&&['returned','in_study'].indexOf(r.status)>-1?'<div class="note warn" style="margin:10px 0">'+esc(r.reviewNote)+'</div>':'')+(r.description?'<p>'+esc(r.description)+'</p>':'')+info+'<div class="row" style="margin:12px 0">'+acts+(r.canEditBasic?'<button class="btn sm light" data-edit="1">'+esc(T('تعديل','Edit'))+'</button>':'')+(r.tenderId?'<span class="mini">'+esc(T('العطاء منشور وظاهر للمقاولين','Tender is published and visible to bidders'))+'</span>':'')+'</div>'+pub+fid+'<h3 style="margin:14px 0 4px">'+esc(T('وثائق العطاء','Tender documents'))+'</h3><table class="p-table"><thead><tr><th>'+esc(T('النوع','Type'))+'</th><th>'+esc(T('الملف','File'))+'</th><th></th><th></th><th></th></tr></thead><tbody>'+docs+'</tbody></table>'+up+'<h3 style="margin:14px 0 4px">'+esc(T('السجل','History'))+'</h3><ul class="timeline">'+ev+'</ul>'}

function publishHtml(r){var rows=[['الخبرة السابقة في مشاريع مماثلة','Previous experience in similar projects',30,1],['المنهجية وخطة التنفيذ','Methodology and execution plan',30,1],['الفريق والموارد','Team and resources',20,1],['السلامة والجودة','Safety and quality',20,0]];
  return '<div class="note amber" style="margin:10px 0"><b>'+esc(T('إنشاء العطاء من الطلب','Create the tender from this request'))+'</b><div class="grid2" style="margin-top:8px"><div class="fld"><label>'+esc(T('اسم العطاء','Tender name'))+'</label><input id="p_name" value="'+esc(r.title)+'"></div><div class="fld"><label>'+esc(T('بالإنجليزية (اختياري)','In English (optional)'))+'</label><input id="p_nameEn" dir="ltr" value="'+esc(r.titleEn||'')+'"></div><div class="fld"><label>'+esc(T('الرقم المرجعي','Reference'))+'</label><input id="p_ref" dir="ltr" placeholder="T-2026-001"></div><div class="fld"><label>'+esc(T('آخر موعد لاستلام العروض','Closing date'))+'</label><input id="p_closing" type="date"></div><div class="fld"><label>'+esc(T('الحد الفني (من 60)','Technical threshold (of 60)'))+'</label><input id="p_thr" type="number" value="50" min="1" max="60"></div></div><div class="mini">'+esc(T('متطلبات التقييم الفني (مجموع الأوزان 100):','Technical evaluation requirements (weights must total 100):'))+'</div><div id="p_reqs">'+rows.map(function(x){return '<div class="req"><input class="pt" value="'+esc(T(x[0],x[1]))+'"><input class="pw" type="number" value="'+x[2]+'"><label class="mini"><input class="pm" type="checkbox"'+(x[3]?' checked':'')+'> '+esc(T('إلزامي','Mandatory'))+'</label><input class="pte" dir="ltr" style="grid-column:1/-1" placeholder="English title (optional)" value="'+esc(x[1])+'"></div>'}).join('')+'</div><div class="row" style="margin-top:8px"><button class="btn amber" data-dopublish="1">'+esc(T('نشر العطاء','Publish tender'))+'</button><button class="btn light" data-cancelpub="1">'+esc(T('إلغاء','Cancel'))+'</button></div></div>'}

/* ---------------- الفريق ---------------- */
function teamHtml(){var o=S.org,s=o.seats;
  var mem=o.members.map(function(m){var sel='<select data-role="'+esc(m.id)+'"'+(m.isOwner?' disabled':'')+'>'+o.roles.map(function(r){return '<option value="'+r.key+'"'+(m.role===r.key?' selected':'')+'>'+esc(EN()?r.en:r.ar)+'</option>'}).join('')+'</select>';return '<tr><td><b>'+esc(m.name)+'</b>'+(m.isOwner?' <span class="badge proc">'+esc(T('صاحب الاشتراك','Subscription owner'))+'</span>':'')+'<br><span class="mini">'+esc(m.email||'')+'</span></td><td>'+sel+'</td><td class="mini">'+fmt(m.joinedAt)+'</td><td>'+(m.isOwner?'':'<button class="btn sm light" data-rm="'+esc(m.id)+'">'+esc(T('إزالة','Remove'))+'</button>')+'</td></tr>'}).join('');
  var inv=o.invites.map(function(i){return '<tr><td>'+esc(i.label||'—')+'</td><td>'+esc(roleName(i.role))+'</td><td class="mini">'+esc(T('ينتهي ','Expires '))+fmt(i.expiresAt)+'</td><td><button class="btn sm light" data-revoke="'+esc(i.id)+'">'+esc(T('إلغاء الدعوة','Revoke'))+'</button></td></tr>'}).join('');
  var codeBox=S.invite?'<div class="note teal"><b>'+esc(T('رمز الدعوة (يظهر مرة واحدة فقط):','Invitation code (shown once):'))+'</b><div class="codebox">'+esc(S.invite)+'</div><span class="mini">'+esc(T('أرسله للعضو بوسيلة آمنة. يسجّل العضو كحساب «مشتريات» ثم يدخله من هذه الصفحة في خانة الانضمام.','Send it to the member securely. They register a procurement account and enter it in the join box on this page.'))+'</span></div>':'';
  var solo=o.members.length===1&&!S.list.length?'<section class="p-card"><h2><span class="n">04</span> '+esc(T('لديك رمز دعوة لجهة أخرى؟','Have an invitation code for another organization?'))+'</h2><div class="row"><input id="j_code" dir="ltr" placeholder="XXXXX-XXXXX"><button class="btn amber" data-join="1">'+esc(T('انضمام','Join'))+'</button></div><p class="mini">'+esc(T('سيتم نقلك إلى تلك الجهة بدورك المحدد، وتُحذف جهتك الحالية الفارغة.','You will move to that organization with the assigned role; your current empty organization is removed.'))+'</p></section>':'';
  return '<section class="p-card"><h2><span class="n">01</span> '+esc(T('أعضاء الجهة','Team members'))+'</h2><div class="note">'+esc(T('المقاعد المستخدمة: ','Seats used: '))+'<b>'+s.used+' / '+(s.max==null?T('غير محدود','unlimited'):s.max)+'</b> · '+esc(EN()?s.planNameEn:s.planName)+'</div><table class="p-table"><thead><tr><th>'+esc(T('العضو','Member'))+'</th><th>'+esc(T('الدور','Role'))+'</th><th></th><th></th></tr></thead><tbody>'+mem+'</tbody></table></section>'+
  '<section class="p-card"><h2><span class="n">02</span> '+esc(T('دعوة عضو','Invite a member'))+'</h2>'+codeBox+'<div class="row"><input id="i_label" placeholder="'+esc(T('اسم العضو (للتذكير)','Member name (label)'))+'"><select id="i_role">'+o.roles.map(function(r){return '<option value="'+r.key+'">'+esc(EN()?r.en:r.ar)+'</option>'}).join('')+'</select><button class="btn amber" data-invite="1">'+esc(T('إنشاء رمز دعوة','Create invitation code'))+'</button></div>'+(inv?'<table class="p-table" style="margin-top:10px"><thead><tr><th>'+esc(T('الاسم','Label'))+'</th><th>'+esc(T('الدور','Role'))+'</th><th></th><th></th></tr></thead><tbody>'+inv+'</tbody></table>':'')+'<p class="mini">'+esc(T('الأدوار: مالك/طالب يقدّم الطلبات · دائرة المشاريع تجهّز المخططات والمواصفات وشروط العقد · المشتريات تنشر العطاء وتقيّمه · مدير الجهة يدير الفريق والتوثيق والفوترة.','Roles: owner/requester submits requests · projects prepares drawings, specs and contract conditions · procurement publishes and evaluates · manager runs the team, verification and billing.'))+'</p></section>'+
  '<section class="p-card"><h2><span class="n">03</span> '+esc(T('إعدادات الجهة','Organization settings'))+'</h2><div class="fld"><label>'+esc(T('اسم الجهة','Organization name'))+'</label><input id="s_name" value="'+esc(o.org.name)+'"></div><label class="row"><input type="checkbox" id="s_appr"'+(o.org.requireApproval?' checked':'')+'> '+esc(T('اشترط اعتماد المالك/الطالب لحزمة العطاء قبل وصولها للمشتريات','Require the requester\u2019s approval of the tender package before it reaches procurement'))+'</label><br><button class="btn amber" data-savesettings="1">'+esc(T('حفظ الإعدادات','Save settings'))+'</button><p class="mini">'+esc(T('توثيق الجهة (لنشر العطاءات) يُقدَّم من لوحة المشتريات.','Organization verification (needed to publish tenders) is submitted from the procurement desk.'))+' <a href="../procurement/index.html">'+esc(T('فتح لوحة المشتريات','Open procurement desk'))+'</a></p></section>'+solo}

/* ---------------- الأحداث ---------------- */
function val(id){var e=document.getElementById(id);return e?e.value:''}
function formBody(){return{title:val('f_title'),titleEn:val('f_titleEn'),serviceType:val('f_service'),country:val('f_country'),location:val('f_location'),neededBy:val('f_needed'),budget:val('f_budget'),currency:val('f_currency'),description:val('f_desc')}}
function act(p){return p.then(function(){say('');return load()}).catch(function(e){say(e.message,'warn')})}
document.addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;var d=b.dataset;
  if(d.tab){S.tab=d.tab;S.invite=null;render();return}
  if('filter' in d){S.filter=d.filter;render();return}
  if(d.open){S.sel=d.open;S.form=null;S.publish=false;API.request('GET','/requests/'+d.open).then(function(r){S.detail=r.request;render()}).catch(function(e){say(e.message,'warn')});return}
  if(d.new){S.form={};S.sel=null;S.detail=null;render();return}
  if(d.edit){S.form=S.detail;render();return}
  if(d.cancelform){S.form=null;render();return}
  if(d.save){var body=formBody();var req=S.form&&S.form.id?API.request('PATCH','/requests/'+S.form.id,body):API.request('POST','/requests',body);req.then(function(r){S.sel=r.request.id;S.form=null;say(T('تم الحفظ.','Saved.'));return load()}).catch(function(e){say(e.message,'warn')});return}
  if(d.savetech){act(API.request('PATCH','/requests/'+S.sel,{fidicBook:val('t_book'),fidicEdition:val('t_ed'),particularNotes:val('t_notes')}));return}
  if(d.act){var a=d.act;if(a==='publish'){S.publish=true;render();return}var note='';if(NOTE_ASK[a]){note=prompt(T(NOTE_ASK[a][0],NOTE_ASK[a][1]));if(note===null)return}
    if(a==='cancel'&&!confirm(T('إلغاء هذا الطلب؟','Cancel this request?')))return;act(API.request('POST','/requests/'+S.sel+'/transition',{action:a,note:note}));return}
  if(d.cancelpub){S.publish=false;render();return}
  if(d.dopublish){var rows=[].map.call(document.querySelectorAll('#p_reqs .req'),function(r){return{title:r.querySelector('.pt').value,titleEn:r.querySelector('.pte').value,weight:Number(r.querySelector('.pw').value),mandatory:r.querySelector('.pm').checked}});
    API.request('POST','/requests/'+S.sel+'/tender',{name:val('p_name'),nameEn:val('p_nameEn'),reference:val('p_ref'),closing:val('p_closing'),technicalThreshold:Number(val('p_thr')),requirements:rows}).then(function(r){S.publish=false;say(T('تم نشر العطاء وربطه بالطلب.','Tender published and linked to the request.'));return load()}).catch(function(e){say(e.message,'warn')});return}
  if(d.upload){var fs=document.getElementById('u_files').files;if(!fs.length){say(T('اختر ملفاً.','Choose a file.'),'warn');return}var fd=new FormData();fd.append('kind',val('u_kind'));for(var i=0;i<fs.length;i++)fd.append('files',fs[i]);act(API.request('POST','/requests/'+S.sel+'/docs',fd));return}
  if(d.deldoc){if(confirm(T('حذف الوثيقة؟','Delete this document?')))act(API.request('DELETE','/requests/'+S.sel+'/docs/'+d.deldoc));return}
  if(d.invite){API.request('POST','/org/invites',{role:val('i_role'),label:val('i_label')}).then(function(r){S.invite=r.code;say('');return load()}).catch(function(e){say(e.message,'warn')});return}
  if(d.revoke){act(API.request('DELETE','/org/invites/'+d.revoke));return}
  if(d.rm){if(confirm(T('إزالة هذا العضو؟','Remove this member?')))act(API.request('DELETE','/org/members/'+d.rm));return}
  if(d.savesettings){act(API.request('PATCH','/org',{name:val('s_name'),requireApproval:document.getElementById('s_appr').checked}));return}
  if(d.join){API.request('POST','/org/join',{code:val('j_code')}).then(function(r){say(r.message);S.tab='requests';return load()}).catch(function(e){say(e.message,'warn')});return}
});
document.addEventListener('change',function(ev){var s=ev.target;if(s.dataset&&s.dataset.role){act(API.request('PATCH','/org/members/'+s.dataset.role,{role:s.value}))}});
document.getElementById('logout').onclick=function(){API.logout().then(function(){location.href='../portal/pt-9f3c7a1e5b2d/login.html'})};
var t0=Date.now();window.addEventListener('mmc:lang',function(){if(Date.now()-t0>1500)location.reload()});
if(window.MMC_I18N){MMC_I18N.mountSwitcher(document.querySelector('.p-top'))}
load();
})();
</script>
