<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة الإدارة · MMC</title><link rel="stylesheet" href="../portal/pt-9f3c7a1e5b2d/assets/portal.css"><style>
.admin-wrap{max-width:1250px;margin:0 auto;padding:30px 22px 70px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.admin-head h1{margin:0}.filter{display:flex;gap:8px;align-items:center}.filter select,.filter input,.reason{padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit}.table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:1000px}.admin-table th,.admin-table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:right}.admin-table th{background:var(--ink);color:#fff}.status{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:800}.pending{background:#fff7ed;color:#9a3412}.paid{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{font-size:12px;color:var(--mut)}.notice{margin:18px 0;padding:14px;border-radius:8px;background:var(--teal-l);color:var(--ink)}
</style></head><body>
<div class="p-top"><div class="brand"><span class="mark">M</span><span>بوابة الإدارة<small>مراجعة الدفع وتفعيل الاشتراكات</small></span></div><span class="pid">ADMIN / BILLING</span><div class="spacer"></div><a class="btn ghost" href="../index-ar.html">الرئيسية</a><button class="btn ghost" id="logout">خروج</button></div>
<div class="admin-wrap"><div class="admin-head"><div><div class="eyebrow">إدارة الاشتراكات</div><h1>الفواتير وإيصالات التحويل</h1><p class="small">لا يتم تفعيل الباقة إلا بعد مراجعة الإيصال واعتماد التحويل.</p></div><div class="filter"><label>الحالة</label><select id="status"><option value="">الكل</option><option value="pending">قيد المراجعة</option><option value="paid">مدفوعة</option><option value="rejected">مرفوضة</option></select><button class="btn amber" id="refresh">تحديث</button></div></div>
<div id="notice" class="notice" hidden></div><div class="p-card"><div class="table-wrap"><table class="admin-table"><thead><tr><th>الفاتورة</th><th>العميل</th><th>الباقة</th><th>المبلغ</th><th>الإيصال</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody id="rows"><tr><td colspan="7">جارٍ التحميل…</td></tr></tbody></table></div></div></div>
<script>
(function(){const $=s=>document.querySelector(s), rows=$('#rows'), notice=$('#notice');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function msg(t){notice.textContent=t;notice.hidden=false;setTimeout(()=>notice.hidden=true,4500);}async function api(url,opt){const r=await fetch(url,Object.assign({credentials:'include',headers:{'Content-Type':'application/json'}},opt||{}));const d=await r.json().catch(()=>({}));if(r.status===401||r.status===403){location.href='../portal/pt-9f3c7a1e5b2d/login.html';throw Error(d.error?.message||'لا تملك الصلاحية');}if(!r.ok)throw Error(d.error?.message||'حدث خطأ');return d;}async function load(){try{const q=$('#status').value;const d=await api('/api/billing/admin/invoices'+(q?'?status='+encodeURIComponent(q):''));if(!d.invoices.length){rows.innerHTML='<tr><td colspan="7">لا توجد فواتير.</td></tr>';return;}rows.innerHTML=d.invoices.map(i=>`<tr><td><strong>${esc(i.invoiceNumber)}</strong><div class="small">${new Date(i.createdAt*1000).toLocaleString('ar-JO')}</div></td><td>${esc(i.customerName)}<div class="small">${esc(i.customerEmail)}<br>${esc(i.customerCompany||'')}</div></td><td>${esc(i.planKey)}<div class="small">${esc(i.billingCycle)}</div></td><td><strong>${esc(i.currency)} ${esc(i.amount)}</strong><div class="small">${esc(i.paymentMethod)}</div></td><td>${i.receiptName?`<a class="btn sm light" target="_blank" href="/api/billing/admin/invoices/${encodeURIComponent(i.id)}/receipt">فتح الإيصال</a>`:'<span class="small">لم يرفع</span>'}</td><td><span class="status ${esc(i.status)}">${i.status==='pending'?'قيد المراجعة':i.status==='paid'?'مدفوعة':i.status==='rejected'?'مرفوضة':esc(i.status)}</span></td><td><div class="actions">${i.status==='pending'&&i.receiptName?`<button class="btn sm amber" data-approve="${esc(i.id)}">اعتماد وتفعيل</button><button class="btn sm light" data-price="${esc(i.id)}" data-cur="${esc(i.currency)}" data-amt="${esc(i.amount)}">سعر خاص</button><button class="btn sm light" data-reject="${esc(i.id)}">رفض</button>`:'—'}</div></td></tr>`).join('');}catch(e){rows.innerHTML='<tr><td colspan="7">'+esc(e.message)+'</td></tr>';}}rows.addEventListener('click',async e=>{const a=e.target.closest('[data-approve]'),r=e.target.closest('[data-reject]'),pr=e.target.closest('[data-price]');try{if(pr){const v=prompt('المبلغ الخاص لهذه الفاتورة ('+pr.dataset.cur+'):',pr.dataset.amt);if(v===null)return;await api('/api/billing/admin/invoices/'+pr.dataset.price+'/amount',{method:'POST',body:JSON.stringify({amount:Number(v),currency:pr.dataset.cur})});msg('تم تحديد السعر الخاص.');await load();}if(a){if(!confirm('اعتماد التحويل وتفعيل الباقة لمدة الدورة؟'))return;await api('/api/billing/admin/invoices/'+a.dataset.approve+'/approve',{method:'POST',body:'{}'});msg('تم اعتماد التحويل وتفعيل الباقة.');await load();}if(r){const reason=prompt('سبب الرفض:','لم تتم مطابقة التحويل.');if(reason===null)return;await api('/api/billing/admin/invoices/'+r.dataset.reject+'/reject',{method:'POST',body:JSON.stringify({reason})});msg('تم رفض الفاتورة.');await load();}}catch(e){msg(e.message);}});$('#refresh').onclick=load;$('#status').onchange=load;$('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'include'});location.href='../index-ar.html';};api('/api/auth/me').then(d=>{if(d.user.role!=='admin'){location.href='../portal/pt-9f3c7a1e5b2d/login.html';return}load();}).catch(()=>{});})();
</script></body></html>
