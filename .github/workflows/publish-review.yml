name: Publish approved MMC review to production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH to confirm publishing the latest review version
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mmc-website-production-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirmation == 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: website/mmc-marketing-launch
          path: production
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: preview/mmc-hero-instagram-reel
          path: review
          persist-credentials: false

      - name: Publish reviewed website files
        shell: bash
        run: |
          set -euo pipefail
          test -f review/mmc-website/index.html
          rm -rf production/mmc-website
          cp -a review/mmc-website production/mmc-website
          cd production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mmc-website
          if git diff --cached --quiet; then
            echo "No website changes to publish."
            exit 0
          fi
          git commit -m "Publish approved MMC review version"
          git push origin HEAD:website/mmc-marketing-launch
