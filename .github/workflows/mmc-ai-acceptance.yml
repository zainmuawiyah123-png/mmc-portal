name: MMC AI acceptance tests
on:
  push:
    branches:
      - feature/mmc-ai-construction-intelligence
      - feature/mmc-ai-drawing-reader-demo
    paths:
      - 'server/**'
      - 'Dockerfile'
      - 'webpages/mmc-ai/**'
      - 'webpages/technical-proposal-kit_v5/mmc-ai/**'
      - '.github/workflows/mmc-ai-acceptance.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'Dockerfile'
      - 'webpages/mmc-ai/**'
      - '.github/workflows/mmc-ai-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mmc-ai-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install OCR runtime and fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara fonts-dejavu-core
      - name: Setup Python 3.12 for scanned fixture generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF fixture generator
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Verify OCR runtime
        run: |
          pdfinfo -v
          pdftoppm -v
          tesseract --list-langs
          python -c "from PIL import Image, ImageDraw, ImageFont"
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete MMC AI acceptance suite
        run: npm run test:mmc-ai
      - name: Build production Docker image with OCR packages
        run: docker build -f ../Dockerfile -t mmc-ai-ocr-acceptance ..
