name: MMC release source package

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
      - name: Create clean source archive
        run: |
          mkdir -p dist
          zip -qr dist/MMC-release-candidate.zip . \
            -x '.git/*' '*/node_modules/*' 'node_modules/*' \
               '*/.env' '.env' '*/.env.local' '.env.local' \
               '*/data/*' '*/uploads/*' '*/backups/*' \
               '*.sqlite' '*.sqlite3' '*.db' '*.db-*' \
               'dist/*' 'ADMIN-CREDENTIALS_AR.md' 'mmc-proposal-kit/ADMIN-CREDENTIALS_AR.md'
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: MMC-release-candidate
          path: dist/MMC-release-candidate.zip
          if-no-files-found: error
          retention-days: 14
