name: MMC live public source smoke test
on:
  pull_request:
    paths:
      - 'server/scripts/live-source-smoke.js'
      - 'server/src/lib/apc-sync.js'
      - 'server/src/lib/joneps-sync.js'
      - 'server/src/lib/opportunity-sync.js'
      - 'server/src/lib/ungm-sync.js'
      - 'server/src/lib/bahrain-sync.js'
      - '.github/workflows/mmc-live-source-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  live-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Read-only live checks against public tender sources
        env:
          UNGM_ACCESS_TOKEN: ${{ secrets.UNGM_ACCESS_TOKEN }}
        run: node scripts/live-source-smoke.js
