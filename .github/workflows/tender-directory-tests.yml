name: MMC tender directory tests

on:
  push:
    branches:
      - feature/jordan-corporate-tender-sources
      - preview/tender-directory-validation
  pull_request:
    branches:
      - main
      - release/v5-unified-tenders-2026-11-06

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm run test:all
