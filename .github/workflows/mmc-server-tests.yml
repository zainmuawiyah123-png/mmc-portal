name: MMC server tests
on:
  push:
    branches:
      - 'feature/tender-intelligence-jo-sa-uae'
    paths:
      - 'mmc-proposal-kit/server/**'
      - '.github/workflows/mmc-server-tests.yml'
  pull_request:
    paths:
      - 'mmc-proposal-kit/server/**'
      - '.github/workflows/mmc-server-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mmc-proposal-kit/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mmc-proposal-kit/server/package-lock.json
      - run: npm ci
      - run: node --check src/migrate.js && node --check src/index.js && node --check src/routes/public-apc-tenders.js && node --check src/routes/public-worldbank-tenders.js && node --check src/routes/public-vendorpanel-tenders.js && node --check src/routes/public-tenders.js
      - run: npm test
