name: MMC tender connector tests
on:
  pull_request:
    paths:
      - 'server/**'
      - 'webpages/technical-proposal-kit_v5/tender-opportunities/**'
      - '.github/workflows/mmc-tender-tests.yml'
  push:
    branches:
      - 'feature/apc-internal-tender-directory'
    paths:
      - 'server/**'
      - 'webpages/technical-proposal-kit_v5/tender-opportunities/**'
      - '.github/workflows/mmc-tender-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: node --check src/lib/apc-sync.js && node --check src/routes/opportunities.js && node --check src/migrate.js && node --check src/index.js
      - run: npm run test:all
