name: Project finance pre-deployment tests

on:
  push:
    branches:
      - feature/contractor-award-payment-cycle
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      JWT_SECRET: isolated-ci-secret-not-for-production
      DB_PATH: /tmp/mmc-project-finance-ci.sqlite
      UPLOAD_DIR: /tmp/mmc-project-finance-uploads
      BACKUP_DIR: /tmp/mmc-project-finance-backups
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm install && npm install --include=dev
      - name: Commit refreshed dependency lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          git diff --cached --quiet || (git commit -m "Refresh patched server dependency lockfile" && git push origin HEAD:feature/contractor-award-payment-cycle)
      - name: Audit all dependency trees
        run: npm audit --audit-level=moderate
      - name: Install Playwright browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Syntax check project finance modules
        run: |
          node --check src/project-finance/schema.js
          node --check src/routes/project-finance.js
          node --check src/lib/org.js
          node --check src/index.js
      - name: Start isolated MinIO test server
        run: |
          docker run -d --name mmc-minio -p 9500:9000 \
            -e MINIO_ROOT_USER=mmctestkey \
            -e MINIO_ROOT_PASSWORD=mmctestsecret123 \
            quay.io/minio/minio server /data --address ":9000"
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9500/minio/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9500/minio/health/ready >/dev/null
          node <<'NODE'
          const { S3Client, CreateBucketCommand } = require('@aws-sdk/client-s3');
          const client = new S3Client({ region: 'us-east-1', endpoint: 'http://127.0.0.1:9500', forcePathStyle: true,
            credentials: { accessKeyId: 'mmctestkey', secretAccessKey: 'mmctestsecret123' } });
          client.send(new CreateBucketCommand({ Bucket: 'tpkit-test' })).then(() => process.exit(0)).catch((e) => { console.error(e); process.exit(1); });
          NODE
      - name: Run API, migration and storage tests
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9500
          S3_TEST_BUCKET: tpkit-test
          S3_TEST_KEY: mmctestkey
          S3_TEST_SECRET: mmctestsecret123
        run: npm run test:all
