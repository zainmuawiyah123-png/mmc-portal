name: Project Finance API Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - "webpages/technical-proposal-kit_v5/**"
      - ".github/workflows/project-finance-tests.yml"
  push:
    branches:
      - feature/po-invoice-workflow
    paths:
      - "server/**"
      - "webpages/technical-proposal-kit_v5/**"
      - ".github/workflows/project-finance-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start isolated S3-compatible test server
        run: |
          mkdir -p /tmp/mmc-s3
          nohup node -e "const S3rver=require('s3rver'); const server=new S3rver({port:9500,address:'127.0.0.1',directory:'/tmp/mmc-s3',silent:true}); server.run().catch(e=>{console.error(e);process.exit(1)});" >/tmp/mmc-s3.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9500/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { S3Client, CreateBucketCommand } = require('@aws-sdk/client-s3');
          const client = new S3Client({
            endpoint: 'http://127.0.0.1:9500',
            region: 'us-east-1',
            forcePathStyle: true,
            credentials: { accessKeyId: 'S3RVER', secretAccessKey: 'S3RVER' }
          });
          client.send(new CreateBucketCommand({ Bucket: 'tpkit-test' }))
            .then(() => console.log('Created isolated S3 test bucket'))
            .catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Run API and S3 integration tests
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9500
          S3_TEST_BUCKET: tpkit-test
          S3_TEST_KEY: S3RVER
          S3_TEST_SECRET: S3RVER
        run: npm run test:all
