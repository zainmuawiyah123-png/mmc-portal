<script>
(function(){
 const langBtn=document.getElementById('langBtn');
 const descriptions={en:"Muawiyah Madadha & His Partner is a Jordanian contracting company established in 2008, delivering earthworks, building construction, sewerage and infrastructure projects.",ar:"شركة معاوية المدادحة وشريكه، شركة مقاولات أردنية تأسست عام 2008، متخصصة في الأعمال الترابية والإنشاءات والمباني والصرف الصحي والبنية التحتية."};
 function setLang(next){
   const lang=next==='ar'?'ar':'en';
   document.documentElement.lang=lang;
   document.documentElement.dir=lang==='ar'?'rtl':'ltr';
   document.querySelectorAll('[data-en][data-ar]').forEach(el=>{
     if(!el.children.length) el.textContent=el.dataset[lang];
   });
   const brandName=document.getElementById('brand-name');
   const brandSubtitle=document.getElementById('brand-subtitle');
   if(brandName) brandName.textContent=brandName.dataset[lang];
   if(brandSubtitle) brandSubtitle.textContent=brandSubtitle.dataset[lang];
   if(langBtn){langBtn.textContent=lang==='en'?'العربية':'English';langBtn.setAttribute('aria-label',lang==='en'?'Switch to Arabic':'التبديل إلى الإنجليزية');}
   const heading=document.querySelector('h1');
   const titleBase=heading?heading.textContent.trim():(lang==='ar'?'شركة معاوية المدادحة وشريكه':'Muawiyah Madadha & His Partner');
   document.title=titleBase+(lang==='ar'?' | شركة معاوية المدادحة وشريكه':' | Muawiyah Madadha & His Partner');
   const description=document.getElementById('page-description');
   if(description) description.setAttribute('content',descriptions[lang]);
   try{localStorage.setItem('parentCompanyLanguage',lang);}catch(e){}
 }
 let saved='en';
 try{saved=localStorage.getItem('parentCompanyLanguage')||'en';}catch(e){}
 setLang(saved);
 if(langBtn) langBtn.addEventListener('click',()=>setLang(document.documentElement.lang==='en'?'ar':'en'));
 const year=document.getElementById('year');if(year)year.textContent=new Date().getFullYear();
})();
</script></body></html>
