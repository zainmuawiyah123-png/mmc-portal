services:
  - type: web
    name: mmc-portal
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
    disk:
      name: mmc-data
      mountPath: /data
      sizeGB: 2
