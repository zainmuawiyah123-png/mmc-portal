<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>تسجيل الدخول · بوابة MMC</title>
<link rel="stylesheet" href="assets/portal.css">
<link rel="stylesheet" href="assets/auth.css">
</head>
<body data-page="login" style="background:var(--ink)">

<div class="auth-wrap">
  <div>
    <div class="auth-card">
      <div class="auth-head">
        <div class="mark">M</div>
        <h1><span data-ar="تسجيل الدخول" data-en="Sign in">تسجيل الدخول</span></h1>
        <p><span data-ar="بوابتك الخاصة لرفع المخططات ووثائق العطاء وتوليد العرض الفني وحساب الكميات."
              data-en="Your private portal to upload drawings and tender documents, then generate the technical proposal and take-off.">بوابتك الخاصة لرفع المخططات ووثائق العطاء وتوليد العرض الفني وحساب الكميات.</span></p>
      </div>

      <div class="auth-body">
        <div class="auth-alert" id="alert"></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email"><span data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</span></label>
            <input type="email" id="email" name="email" autocomplete="username" required
                   dir="ltr" placeholder="you@company.com">
            <div class="err-msg" id="emailErr"></div>
          </div>

          <div class="field">
            <label for="password"><span data-ar="كلمة المرور" data-en="Password">كلمة المرور</span></label>
            <input type="password" id="password" name="password" autocomplete="current-password" required
                   dir="ltr" placeholder="••••••••">
            <div class="err-msg" id="passErr"></div>
          </div>

          <button type="submit" class="auth-submit" id="submitBtn">
            <span data-ar="دخول" data-en="Sign in">دخول</span>
          </button>
        </form>

        <div class="auth-foot">
          <span data-ar="ليس لديك حساب؟" data-en="No account yet?">ليس لديك حساب؟</span>
          <a href="register.html"><span data-ar="أنشئ حساباً" data-en="Create one">أنشئ حساباً</span></a>
        </div>
      </div>
    </div>

    <div class="auth-note">
      <b data-ar="المرحلة الأولى" data-en="Phase 1">المرحلة الأولى</b>
      <span data-ar=" — خادم وقاعدة بيانات ومصادقة حقيقية. كلمة المرور مشفّرة بـ bcrypt، والجلسة في كوكي httpOnly."
            data-en=" — real server, database and authentication. Passwords are bcrypt-hashed; the session lives in an httpOnly cookie."> — خادم وقاعدة بيانات ومصادقة حقيقية. كلمة المرور مشفّرة بـ bcrypt، والجلسة في كوكي httpOnly.</span>
      <br>
      <span data-ar="لا يوجد دفع فعلي في هذه المرحلة." data-en="No real payment in this phase.">لا يوجد دفع فعلي في هذه المرحلة.</span>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
(function(){
  'use strict';
  var LANG_KEY='tpkit-portal-lang';
  function lang(){ try{return localStorage.getItem(LANG_KEY)||'ar';}catch(e){return 'ar';} }
  function T(ar,en){ return lang()==='ar'?ar:en; }

  document.documentElement.setAttribute('dir', lang()==='ar'?'rtl':'ltr');
  document.documentElement.setAttribute('lang', lang());
  document.querySelectorAll('[data-ar]').forEach(function(n){
    var v=n.getAttribute('data-'+lang()); if(v!==null) n.textContent=v;
  });

  var form=document.getElementById('loginForm');
  var alertBox=document.getElementById('alert');
  var btn=document.getElementById('submitBtn');

  function showAlert(msg, kind){
    alertBox.textContent=msg;
    alertBox.className='auth-alert on '+(kind||'err');
  }
  function hideAlert(){ alertBox.className='auth-alert'; }
  function fieldErr(id,msg){
    var e=document.getElementById(id);
    if(!e) return;
    e.textContent=msg||'';
    e.classList.toggle('on', !!msg);
    var inp=document.getElementById(id.replace('Err',''));
    if(inp) inp.setAttribute('aria-invalid', msg?'true':'false');
  }
  function busy(on,label){
    btn.disabled=on;
    btn.innerHTML = on ? '<span class="spinner"></span>'+T('جارٍ التحقق…','Checking…') : label;
  }
  var defaultLabel='<span data-ar="دخول" data-en="Sign in">دخول</span>';

  // إن كانت هناك جلسة قائمة، تجاوز صفحة الدخول
  API.me().then(function(){
    var next=new URLSearchParams(location.search).get('next') || 'index.html';
    location.replace(safeNext(next));
  }).catch(function(){ /* لا جلسة — ابقَ هنا */ });

  function safeNext(n){
    // منع إعادة التوجيه المفتوح: مسارات نسبية فقط داخل البوابة
    // مسموح: صفحات البوابة نفسها، أو بوابات المقاول/المشتريات/الإدارة بالضبط
    if(/^\.\.\/\.\.\/(bid|procurement|admin)\/index\.html$/.test(n)) return n;
    if(/^[a-z-]+\.html(\?[A-Za-z0-9_=&.-]*)?$/.test(n)) return n;
    return 'index.html';
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    hideAlert();
    fieldErr('emailErr',''); fieldErr('passErr','');

    var email=document.getElementById('email').value.trim();
    var pass=document.getElementById('password').value;

    if(!email){ fieldErr('emailErr',T('أدخل البريد الإلكتروني.','Enter your email.')); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ fieldErr('emailErr',T('صيغة البريد غير صحيحة.','Invalid email format.')); return; }
    if(!pass){ fieldErr('passErr',T('أدخل كلمة المرور.','Enter your password.')); return; }

    busy(true);
    API.login({email:email,password:pass}).then(function(res){
      showAlert(T('تم تسجيل الدخول. جارٍ التحويل…','Signed in. Redirecting…'),'ok');
      var next=new URLSearchParams(location.search).get('next');
      if(!next) next=(res.user && res.user.role==='admin') ? '../../admin/index.html' : (res.user && res.user.role==='buyer' ? '../../procurement/index.html' : 'index.html');
      setTimeout(function(){ location.replace(safeNext(next)); }, 350);
    }).catch(function(err){
      busy(false, defaultLabel);
      if(err.status===429){
        showAlert(err.message || T('محاولات كثيرة. انتظر قليلاً.','Too many attempts. Wait a moment.'),'err');
      } else if(err.status===401){
        showAlert(T('البريد الإلكتروني أو كلمة المرور غير صحيحة.','Incorrect email or password.'),'err');
        fieldErr('passErr',T('تحقق من كلمة المرور.','Check your password.'));
      } else if(err.code==='NETWORK'){
        showAlert(T('تعذّر الاتصال بالخادم. تأكد أنه يعمل ثم أعد المحاولة.','Cannot reach the server. Make sure it is running, then retry.'),'err');
      } else {
        showAlert(err.message || T('تعذّر تسجيل الدخول.','Sign-in failed.'),'err');
      }
    });
  });
})();
</script>
</body>
</html>
